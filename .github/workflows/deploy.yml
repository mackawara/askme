name: Update app on VM and restart using updated code

on:
  push:
    branches: [staging]
    paths:
      - src/**
      - 'package.json'
      - .github/**
      - './*'
      - package.json
      - .github/**
      - ./**
      - .**
      - /**
      - './'
      - config

env:
  ME: ${{secrets.ME}}
  EXECPATH: ${{secrets.EXECPATH}}
  PORT: ${{secrets.PORT}}
  NODE_ENV: ${{secrets.NODE_ENV}}
  ORACLE_VM_PRIVATE_KEY: ${{secrets.ORACLE_PRIVATE_KEY}}
  ORACLE_VM_URL: ${{secrets.ORACLE_VM_URL}}
  ORACLE_USERNAME: ${{secrets.ORACLE_USERNAME}}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set permissions for private key
        run: |
          echo "${{ secrets.ORACLE_VM_PRIVATE_KEY }}" > nothandoracle.key
          chmod 600 nothandoracle.key
      - name: SSH into EC2 instance and navigate to repo and reset branch to staging
        run: |
          ssh -o StrictHostKeyChecking=no -i  nothandoracle.key $ORACLE_USERNAME@$ORACLE_VM_URL 'cd repos/askme  && git fetch --all && git reset --hard origin/staging'
      - name: use npm install to install any additional packages
        run: |
          ssh -o StrictHostKeyChecking=no -i  nothandoracle.key $ORACLE_USERNAME@$ORACLE_VM_URL 'cd repos/askme && rm -rf node_modules  && npm install'
      - name: Restart app using pm2
        run: |
          ssh -o StrictHostKeyChecking=no -i  nothandoracle.key $ORACLE_USERNAME@$ORACLE_VM_URL 'pm2 restart askme'
